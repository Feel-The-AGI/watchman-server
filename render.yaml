# Watchman API — Render blueprint for a free web service.
# Create the service from this file, then paste the secret values in the dashboard.
# Do not put secret values in this file.

services:
  - type: web
    name: watchman-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: EXCHANGE_RATE_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Watchman <notifications@trywatchman.app>
      - key: CRON_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://trywatchman.app,https://www.trywatchman.app,https://watchman.app,https://www.watchman.app,https://watchman-client.vercel.app

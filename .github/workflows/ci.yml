name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: watchman
          POSTGRES_PASSWORD: watchman
          POSTGRES_DB: watchman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchman -d watchman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://watchman:watchman@localhost:5432/watchman_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "psycopg[binary]"

      - name: Test
        run: pytest -m "not live" --tb=short

name: live

on:
  workflow_dispatch:
  schedule:
    # Daily read-only checks against the deployed API. No accounts are created.
    - cron: "15 6 * * *"

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Read-only live suite
        env:
          LIVE_BASE_URL: https://watchman-api-9puy.onrender.com
        run: pytest tests/live --tb=short
